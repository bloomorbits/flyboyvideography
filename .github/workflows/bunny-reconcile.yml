name: Bunny status reconcile

# Scheduled sweep for Bunny webhook backfill. Polls Bunny for deliverables
# stuck in a non-terminal status past the stale threshold (missed webhook) and
# repairs them. One-shot mint-and-POST against the Railway backend endpoint.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CRON_JOB_JWT_SECRET  — MUST match the value set on the Railway backend
#                          (same secret as daily-invoicing; the endpoint keys off
#                           a DISTINCT audience+scope, so tokens don't cross)
#   SELF_URL             — Railway backend base URL (e.g. https://flyboy-api.up.railway.app)

on:
  schedule:
    # Every 15 minutes. Bunny transcodes finish in seconds-to-minutes, so a
    # webhook missed at :02 is repaired by :15 at the latest. GitHub cron is
    # UTC and best-effort (may lag a few minutes under load) — fine here.
    - cron: "*/15 * * * *"
  # Manual trigger for verification / ad-hoc runs.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (poll Bunny but do not write)"
        type: boolean
        default: false

concurrency:
  # Never let two reconcile sweeps overlap.
  group: bunny-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet "PyJWT>=2.8" "httpx>=0.27"

      - name: Run Bunny reconcile
        env:
          CRON_JOB_JWT_SECRET: ${{ secrets.CRON_JOB_JWT_SECRET }}
          SELF_URL: ${{ secrets.SELF_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/run_bunny_reconcile_cron.py
