[pytest]
# The canonical backend suite lives in backend/tests/*.py.
# backend/tests/legacy/ holds ARCHIVED snapshot tests (see its README) that
# depend on purged demo-seed data and are superseded by the maintained
# suites — excluded from the default run so `pytest backend/tests/` is a
# trustworthy green signal. Run them explicitly only for historical spelunking.
norecursedirs = legacy .git __pycache__ node_modules
